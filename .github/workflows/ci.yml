# .github/workflows/ci.yml
name: CI with Test Strategy Comment

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (packageManager)
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 型情報を使うルール（no-floating-promises など）を含めて lint する
      # （.kiro/specs/react-2026-refactoring Requirement 11.3）
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 型・lint・全 Vitest（React Compiler の全ファイル検査を含む）の必須の確認はここだけで行う。
      # browser.yml はブラウザのテストだけを走らせる
      - name: Run tests
        run: pnpm test
