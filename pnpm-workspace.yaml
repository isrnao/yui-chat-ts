packages:
  - '.'
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: true
# pnpm 12の供給元保護を維持。未公開/公開直後の版へ自動追随しない。
minimumReleaseAge: 1440
blockExoticSubdeps: true
overrides:
  # New Relicのexact pinを、GHSA-px8p-9vwx-vf98の修正版へ限定して更新する。
  '@newrelic/browser-agent>fflate': 0.8.3
