<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Native interaction conformance</title>
  <style>
    body {
      margin: 16px;
      font: 16px sans-serif;
    }
    button {
      min-height: 44px;
    }
    dialog {
      max-width: calc(100vw - 40px);
    }
    dialog::backdrop {
      background: #0005;
    }
    #actions {
      margin: 8px;
      max-width: calc(100vw - 32px);
    }
    @supports (position-area: bottom) {
      #actions {
        margin: 0;
        position-area: bottom;
        position-try-fallbacks: flip-block, flip-inline;
      }
    }
    textarea {
      min-block-size: 3lh;
      max-block-size: 10lh;
      max-inline-size: 100%;
      resize: vertical;
    }
    @supports (field-sizing: content) {
      textarea {
        field-sizing: content;
      }
    }
    :focus-visible {
      outline: 3px solid blue;
      outline-offset: 2px;
    }
  </style>
  <main>
    <a id="behind" href="#content">背景リンク</a>
    <button id="opener" type="button" commandfor="confirm" command="show-modal">確認を開く</button>
    <dialog id="confirm" aria-labelledby="title">
      <h1 id="title">確認</h1>
      <form method="dialog">
        <button value="cancel" autofocus>やめる</button><button value="ok">確定</button>
      </form>
    </dialog>
    <button id="menu-opener" type="button" popovertarget="actions">操作一覧</button>
    <div id="actions" popover="auto">
      <button type="button">通報</button><button type="button">フィルタ</button>
    </div>
    <label for="detail">詳細</label><textarea id="detail" rows="3"></textarea>
    <section id="content">本文</section>
  </main>
  <script>
    // WebKit does not necessarily focus pointer-activated buttons. Keep a logical return target.
    document.querySelector('#confirm').addEventListener('close', () => {
      document.querySelector('#opener').focus({ preventScroll: true });
    });
    if (!('commandForElement' in HTMLButtonElement.prototype)) {
      document
        .querySelector('#opener')
        .addEventListener('click', () => document.querySelector('#confirm').showModal());
    }
  </script>
</html>
